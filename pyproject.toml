[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tom_cqed_tools"
version = "0.1.0"
description = "A collection of circuit QED tools."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "tabulate",
    "marimo"
]

[tool.setuptools.packages.find]
where = ["src"]
