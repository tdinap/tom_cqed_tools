[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tom_cqed_tools"
version = "0.1.0"
description = "A collection of circuit QED tools."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "pandas",
    "tabulate",
    "marimo",
    "h5py",
    "jax",
    "lmfit",
    "ipython",
    "ipynbname",
    "scqubits",
    # qutip must stay <5.2 until scqubits fixes this upstream (4.3.1 is the
    # latest release as of Sep 2026 and still has the bug):
    #   qutip 5.2 switched .as_scipy() to scipy's sparse *array* API, so
    #   scqubits' Qobj_to_scipy_csc_matrix() now returns a csc_array. scqubits
    #   then isinstance-checks against csc_matrix -- a parallel scipy hierarchy,
    #   not a parent -- so every HilbertSpace.eigensys() call dies with
    #   "TypeError: Unsupported operator type: <class '...csc_array'>".
    # Nothing in this repo can work around it; the failure is entirely inside
    # scqubits. Independent of the scipy version (scipy 1.18 is fine).
    # TO REMOVE: when a scqubits release accepts csc_array, drop this pin and
    # run tests/test_strong_coupling_convergence.py to confirm.
    "qutip<5.2",
]
# NOTE: analysis_utils.py also imports `slab` (the Schuster lab package). It is not
# on PyPI and must be installed separately, e.g. from a local checkout:
#     pip install -e /path/to/slab
# Do not add a bare "slab" entry here -- the name `slab` on PyPI is an unrelated
# psychoacoustics package and would install the wrong code.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Only bug-catching checks (undefined names, unused/duplicate imports, unused
# locals). No style/formatting rules -- this repo's style is hand-chosen, not
# ruff-enforced, and running the formatter is out of scope for routine edits.
# F821 (undefined name) and F401 (unused import) are exactly the class of bug
# that broke this file in the Aug 24 2026 merge: six analyze_flattop_rabi
# variables and the ipynbname/glob imports all vanished silently because
# nothing checked for them before commit.
select = ["F"]
